<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Chatbot</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container-fluid chat-container">

        <!-- Header -->
        <header class="chat-header p-3">

            <h1 class="mb-0">My Chatbot</h1>
            <button id="newChatBtn" class="btn btn-primary">
                ↻ &nbsp; Start New Chat
            </button>

        </header>


        <!-- Messages -->
        <main id="chatList">
            <div id="chatMessages"></div>
        </main>

        <div id="chatEndOverlay" class="chat-end-overlay">

            <div class="chat-end-content">
                <img src="/robot.png" alt="Chat ended" class="chat-end-robot">
                <h1>Conversation Ended</h1>
                <p>Thanks for chatting! 👋</p>
                <p>Click the button on the top right to start a new chat.</p>
            </div>

        </div>

        <!-- MessageInput -->
        <form id="chatForm" class="d-flex gap-2 p-3 border-top">

            <input type="text" id="messageInput" class="form-control" placeholder="Type your message..."
                autocomplete="off">

            <button type="submit" class="btn btn-primary">
                Send
            </button>

        </form>

    </div>


    <!-- JS -->
    <!-- Socket.IO client -->
    <script src="/socket.io/socket.io.js"></script>

    <script src="script.js"></script>

</body>

</html>
